global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: '__GMAIL_SENDER__'
  smtp_auth_username: '__GMAIL_SENDER__'
  smtp_auth_password: '__GMAIL_APP_PASSWORD__'
  smtp_require_tls: true

route:
  receiver: email
  group_by: ['alertname', 'job', 'instance']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: email
    email_configs:
      - to: '__GMAIL_RECIPIENT__'
        send_resolved: true
        headers:
          subject: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        html: |
          <h3>{{ .Status | toUpper }}: {{ .CommonLabels.alertname }}</h3>
          {{ range .Alerts }}
          <p><b>{{ .Annotations.summary }}</b><br>{{ .Annotations.description }}</p>
          {{ end }}
